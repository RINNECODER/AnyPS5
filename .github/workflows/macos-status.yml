# Publishes the macOS status site (engine channel badges, native test count, HLE coverage map)
# to GitHub Pages. Runs on the self-hosted Apple Silicon runner, only for this repository's
# own pushes to main (never for fork code).
name: macOS status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  status:
    if: github.repository == 'RINNECODER/AnyPS5'
    runs-on: [self-hosted, anyps5-metal]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/macos_status.py out
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
