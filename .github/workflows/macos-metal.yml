# macOS Apple Silicon CI for the Metal backend, shader bridge, guest shader replay and the Rosetta direct path.
# Runs on the self-hosted Apple Silicon runner. The repository is public, so every
# job refuses pull requests whose head branch lives in another repository: code
# from forks never executes on the self-hosted machine. A fork PR could edit this
# file to drop the guard, so the repository also requires maintainer approval
# before workflows run for any external contributor's pull request.
name: macOS Metal

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-metal-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_COMMON: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=arm64
  CTEST_ARGS: --output-on-failure --timeout 300
  # Test windows on the shared Mac: no Dock icon, no focus steal, parked in a screen corner.
  # Tests that verify real AppKit focus still activate, serialized machine-wide.
  ANYPS5_UNOBTRUSIVE_WINDOWS: "1"

defaults:
  run:
    shell: bash

jobs:
  # Pull requests only: pick the jobs the changed files can affect (tools/ci/impact.py). A job
  # skipped by "if" reports as skipped, which satisfies a required status check, so branch
  # protection keeps matching the unchanged job names. Pushes and manual runs always run all.
  changes:
    name: Select impacted jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shader-bridge: ${{ steps.impact.outputs.shader-bridge }}
      guest-replay: ${{ steps.impact.outputs.guest-replay }}
      rosetta-libs: ${{ steps.impact.outputs.rosetta-libs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Impact unit tests
        run: python3 tools/tests/test_ci_impact.py
      - name: Select jobs
        id: impact
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --labels "$LABELS"
          else
            python3 tools/ci/impact.py --all
          fi

  shader-bridge:
    name: macOS shader bridge
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.shader-bridge == 'true')
    runs-on: [self-hosted, anyps5-metal]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Initialize submodules
        run: git submodule update --init --depth 1 3rdparty/SPIRV-Cross 3rdparty/Vulkan-Headers
      - name: Select build directory
        run: echo "BUILD_DIR=$RUNNER_WORKSPACE/ci-build/shader-bridge" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B "$BUILD_DIR" $CMAKE_COMMON
          -DANYPS5_METAL_UTILITIES_ONLY=ON -DANYPS5_METAL_SHADER_BRIDGE=ON
          -DANYPS5_BUILD_METAL_SHADER_BRIDGE_TESTS=ON
      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel
      - name: Test
        run: ctest --test-dir "$BUILD_DIR" $CTEST_ARGS

  guest-replay:
    name: macOS guest replay
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.guest-replay == 'true')
    runs-on: [self-hosted, anyps5-metal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Initialize submodules
        run: >-
          git submodule update --init --depth 1
          3rdparty/SPIRV-Cross 3rdparty/glslang 3rdparty/SPIRV-Headers
          3rdparty/Vulkan-Headers 3rdparty/SDL2
      - name: Select build directory
        run: echo "BUILD_DIR=$RUNNER_WORKSPACE/ci-build/guest-replay" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B "$BUILD_DIR" $CMAKE_COMMON
          -DANYPS5_METAL_UTILITIES_ONLY=ON -DANYPS5_METAL_SHADER_BRIDGE=ON
          -DANYPS5_BUILD_METAL_SHADER_BRIDGE_TESTS=ON -DANYPS5_METAL_GUEST_REPLAY=ON
      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel
      - name: Test
        run: ctest --test-dir "$BUILD_DIR" $CTEST_ARGS --output-junit "$BUILD_DIR/ctest.xml"
      - name: Fail if a test was skipped
        # anyps5_metal_presentation_replay exits 77 (CMake: Skipped) when the runner has no console
        # session or a locked screen. CI treats that as a failure; local runs keep the skip.
        run: python3 tools/ci/fail_on_skips.py "$BUILD_DIR/ctest.xml"

  # Rosetta direct execution (docs/design/rosetta-direct-execution.md): the system
  # libraries built as x86_64 Mach-O libs/<name>.prx. Compile coverage plus the x86_64
  # direct-path tests (DirectMemory, Metal graphics, lib binds, runtime fixtures). Required check; pull requests run it when they touch
  # core/libs, core/relinker, cmake, tools/rosetta or CI (tools/ci/impact.py); pushes and manual runs always.
  rosetta-libs:
    name: macOS Rosetta libs (x86_64 compile)
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.rosetta-libs == 'true')
    runs-on: [self-hosted, anyps5-metal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Initialize submodules
        # SDL2 for the input/audio libraries; the rest for the Metal graphics libraries.
        run: git submodule update --init --depth 1 3rdparty/SDL2 3rdparty/SPIRV-Cross 3rdparty/SPIRV-Headers 3rdparty/Vulkan-Headers 3rdparty/glslang 3rdparty/LibAtrac9 3rdparty/ffmpeg-core 3rdparty/freetype 3rdparty/libjpeg-turbo 3rdparty/stb
      - name: Select build directory
        run: echo "BUILD_DIR=$RUNNER_WORKSPACE/ci-build/rosetta-libs" >> "$GITHUB_ENV"
      - name: Configure
        id: configure
        run: >-
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DANYPS5_ROSETTA_LIBS=ON
      # -k 0 keeps compiling past failures so the summary lists every failing
      # translation unit; the step still fails when any of them does.
      - name: Build (lists failing translation units)
        run: |
          # The build directory persists between runs; never test a stale binary.
          rm -f "$BUILD_DIR/tests/direct_memory_darwin_tests"
          set +e
          cmake --build "$BUILD_DIR" --parallel --target rosetta_libs rosetta_engine rosetta_launcher_tests direct_memory_darwin_tests metal_utility_tests rosetta_direct_graphics_tests rosetta_cpuid_tests shutdown_stop_tests audio_out2_rosetta_tests ajm_opus_surround_tests -- -k 0 > "$BUILD_DIR/build.log" 2>&1
          status=$?
          set -e
          tail -n 3 "$BUILD_DIR/build.log"
          if [ "$status" -ne 0 ]; then
            failing=$(grep '^FAILED: ' "$BUILD_DIR/build.log" | grep -oE 'CMakeFiles/[^/]+\.dir/[^ ]+\.o' |
              sed -E 's#^CMakeFiles/##; s#\.dir/(core/libs/prx/[^/]+/)?#: #; s#\.o$##' | sort -u || true)
            {
              echo "### x86_64 translation units that fail to compile"
              echo '```'
              echo "${failing:-none (the failure is not a compile step; see the log)}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Failing translation units"
            echo "${failing:-none}"
            echo "::endgroup::"
            echo "::group::First errors"
            grep -E 'error:|Undefined symbols' "$BUILD_DIR/build.log" | head -n 60 || true
            echo "::endgroup::"
          fi
          exit "$status"
      - name: Test the Rosetta direct path (x86_64)
        # Runs even when the build step failed on other libraries' translation units.
        # direct_memory_darwin and the metal tests are x86_64 binaries (Rosetta runs them);
        # rosetta_runtime_* relink small guest fixtures and run them under arch -x86_64;
        # rosetta_launcher_tests checks the launcher's stub dylibs and rosetta_launcher_smoke
        # runs a fixture title through anyps5_rosetta_run as MacPS launches one;
        # rosetta_lib_binds checks the libs' cross-imports; audio_out2_* play AudioOut2 through SDL's
        # disk driver (output pacing with fake guests, grain timing, port layouts). Window tests inherit
        # ANYPS5_UNOBTRUSIVE_WINDOWS from the job environment via ctest.
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          if [ ! -x "$BUILD_DIR/tests/direct_memory_darwin_tests" ]; then
            echo "direct_memory_darwin_tests did not build; see the build step"
            exit 1
          fi
          if ! command -v ld.lld >/dev/null && [ ! -x /opt/homebrew/opt/lld/bin/ld.lld ] && [ ! -x /opt/homebrew/opt/llvm/bin/ld.lld ]; then
            echo "::warning::ld.lld not found: rosetta_runtime_* tests are not registered"
          else
            cmake --build "$BUILD_DIR" --parallel --target rosetta_runtime_tests
          fi
          ctest --test-dir "$BUILD_DIR" -R 'direct_memory_darwin|metal_utility_tests|rosetta_direct_graphics|rosetta_lib_binds|rosetta_runtime|rosetta_launcher|rosetta_cpuid|rosetta_shutdown_stop|audio_out2|ajm_opus_surround' --output-on-failure --timeout 180
