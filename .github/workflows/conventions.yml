name: Conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 tools/check_conventions.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
      - name: Release capability contract matches the compiled claim
        # Platform-independent file comparison: catches a drifted tools/diagnostic_package.py
        # contract or a changed core/cpu/src/Main.cpp capability claim on any PR (#331).
        run: python3 tools/tests/test_native_diagnostic_package.py ContractDriftControls
